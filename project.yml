name: PortDeck
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 13
    SWIFT_VERSION: "5.9"

targets:
  PortDeck:
    type: application
    platform: iOS
    sources:
      - path: PortDeck
        excludes:
          - Preview Content/PreviewAssets.xcassets
      - path: PortDeck/Preview Content/PreviewAssets.xcassets
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortDeck
        INFOPLIST_FILE: PortDeck/Info.plist
        CODE_SIGN_ENTITLEMENTS: PortDeck/PortDeck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # PortDeck is the technical product name; the companion app is presented as PortOS.
        INFOPLIST_KEY_CFBundleDisplayName: "PortOS"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        DEVELOPMENT_ASSET_PATHS: "\"PortDeck/Preview Content\""
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets:
        - PortDeckTests
        - PortDeckUITests
      commandLineArguments:
        "-UseInMemoryStore":
          isEnabled: false

  PortDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PortDeckTests
    dependencies:
      - target: PortDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortDeckTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PortDeck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PortDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PortDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PortDeckUITests
    dependencies:
      - target: PortDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortDeckUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: PortDeck
