name: PortOS_Recall
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 5
    SWIFT_VERSION: "5.9"

targets:
  PortOS_Recall:
    type: application
    platform: iOS
    sources:
      - path: PortOS_Recall
        excludes:
          - Preview Content/PreviewAssets.xcassets
      - path: PortOS_Recall/Preview Content/PreviewAssets.xcassets
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortOSRecall
        INFOPLIST_FILE: PortOS_Recall/Info.plist
        CODE_SIGN_ENTITLEMENTS: PortOS_Recall/PortOS_Recall.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "PortOS Recall"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        DEVELOPMENT_ASSET_PATHS: "\"PortOS_Recall/Preview Content\""
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets:
        - PortOS_RecallTests
      commandLineArguments:
        "-SeedSampleData":
          isEnabled: false

  PortOS_RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PortOS_RecallTests
    dependencies:
      - target: PortOS_Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortOSRecallTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PortOS_Recall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PortOS_Recall"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PortOS_RecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PortOS_RecallUITests
    dependencies:
      - target: PortOS_Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.PortOSRecallUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: PortOS_Recall
