name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - testflight
      - 'release/**'

permissions:
  contents: read

env:
  IPHONEOS_DEPLOYMENT_TARGET: ${{ vars.IPHONEOS_DEPLOYMENT_TARGET }}

jobs:
  ci:
    runs-on: macos-latest
    name: Build & Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify deployment Python bootstrap and icon preparation
        run: |
          ./scripts/bootstrap_deploy_python.sh
          .venv-deploy/bin/python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install xcbeautify
        run: |
          brew install xcbeautify xcodegen

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: Native/TailcatBridge/go.sum

      - name: Verify and build native Tailcat transport
        run: |
          set -euo pipefail
          (cd Native/TailcatBridge && go test -race -tags="$(cat build-tags.txt)" ./...)
          ./scripts/build_tailcat_bridge.sh
          xcodegen generate

      - name: List available simulators and runtimes
        run: |
          echo "=== Available Runtimes ==="
          xcrun simctl list runtimes
          echo "=== Available Devices ==="
          xcrun simctl list devices available

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          SIMULATOR_ID="$(python3 scripts/select_ios_simulator.py)"
          DESTINATION="platform=iOS Simulator,id=$SIMULATOR_ID"

          echo "Using destination: $DESTINATION"

          xcodebuild test \
            -project PortDeck.xcodeproj \
            -scheme PortDeck \
            -only-testing:PortDeckTests \
            -destination "$DESTINATION" \
            -destination-timeout 60 \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

          # Native Security needs an application-identifier entitlement, absent
          # from unsigned simulator hosts. Ad hoc signing needs no account.
          xcodebuild test \
            -project PortDeck.xcodeproj \
            -scheme PortDeck \
            -only-testing:PortDeckTests/KeychainCredentialStoreTests/testNativeDeviceOnlyRoundTripUsesUniqueServiceAndCleansUpItsOwnItems \
            -only-testing:PortDeckTests/TailcatTransportTests/testNativeTailcatKeychainRoundTrip \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath build/native-keychain.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

          xcrun xcresulttool get test-results summary --path build/native-keychain.xcresult > build/native-keychain-summary.json
          python3 - <<'PY'
          import json
          with open("build/native-keychain-summary.json") as result:
              summary = json.load(result)
          assert summary["passedTests"] == 2, summary
          assert summary["skippedTests"] == 0, summary
          assert summary["failedTests"] == 0, summary
          PY

          xcodebuild test \
            -project PortDeck.xcodeproj \
            -scheme PortDeck \
            -only-testing:PortDeckUITests/PortDeckUITests/testOfflineDemoCanBeEnteredAndExited \
            -only-testing:PortDeckUITests/PortDeckUITests/testOfflineDemoCanBeEnteredFromSettingsWithoutLogin \
            -only-testing:PortDeckUITests/PortDeckUITests/testDailyLogReminderSettingIsAvailable \
            -only-testing:PortDeckUITests/PortDeckUITests/testTailcatSetupRejectsAnInvalidSecretLocally \
            -destination "$DESTINATION" \
            -destination-timeout 60 \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

  cd:
    runs-on: macos-latest
    name: Build and Deploy to TestFlight
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testflight' || startsWith(github.ref, 'refs/heads/release/'))
    concurrency:
      group: portdeck-testflight
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: Native/TailcatBridge/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check release export configuration before signing
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen dump --type json --file "$RUNNER_TEMP/portdeck-spec.json"
          if ! python3 scripts/check_export_configuration.py "$RUNNER_TEMP/portdeck-spec.json"; then
            echo "### Deployment blocked: export configuration requires operator action (issue #33)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create temporary ASC key file
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_PRIVATE_KEY_PATH: ${{ runner.temp }}/portdeck-asc/AuthKey.p8
        run: |
          set -euo pipefail
          test -n "$APPSTORE_API_PRIVATE_KEY"
          test -n "$APPSTORE_API_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$TEAM_ID"
          umask 077
          mkdir -p "$(dirname "$APPSTORE_API_PRIVATE_KEY_PATH")"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$APPSTORE_API_PRIVATE_KEY_PATH"
          echo "APPSTORE_API_PRIVATE_KEY_PATH=$APPSTORE_API_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare deployment dependencies, icons and unique build number
        id: build
        run: |
          set -euo pipefail
          ./scripts/bootstrap_deploy_python.sh
          .venv-deploy/bin/python3 scripts/prepare_app_icons.py PortDeck/Assets.xcassets/AppIcon.appiconset
          CURRENT_BUILD=$(awk '/CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml)
          BUILD_NUMBER=$(python3 scripts/testflight_build.py next "$CURRENT_BUILD")
          sed -i '' "s/CURRENT_PROJECT_VERSION: $CURRENT_BUILD/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/" project.yml
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "### TestFlight build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build native Tailcat transport and generate project
        run: |
          set -euo pipefail
          ./scripts/build_tailcat_bridge.sh
          xcodegen generate

      - name: Archive iOS app with automatic signing
        run: |
          if [ -n "$IPHONEOS_DEPLOYMENT_TARGET" ]; then
            DEPLOYMENT_ARGS=("IPHONEOS_DEPLOYMENT_TARGET=$IPHONEOS_DEPLOYMENT_TARGET")
          else
            DEPLOYMENT_ARGS=()
          fi

          xcodebuild \
            -project PortDeck.xcodeproj \
            -scheme PortDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PortDeck.xcarchive \
            "${DEPLOYMENT_ARGS[@]}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_API_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

      - name: Verify archived privacy manifest
        run: |
          PRIVACY_MANIFEST="build/PortDeck.xcarchive/Products/Applications/PortDeck.app/PrivacyInfo.xcprivacy"
          test -f "$PRIVACY_MANIFEST"
          plutil -lint "$PRIVACY_MANIFEST"

      - name: Create exportOptions.plist
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export .ipa (automatic signing)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PortDeck.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_API_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'build/export/PortDeck.ipa'
          # Match deploy.sh's upload protocol. Our next step owns processing checks;
          # do not ask the action to manage optional TestFlight app metadata.
          backend: altool
          wait-for-processing: 'false'
          upload-attempts: '1'
          upload-timeout-minutes: '20'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Wait for Apple processing
        run: python3 scripts/testflight_build.py wait "${{ steps.build.outputs.number }}"

      - name: Report deployment result
        if: always()
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          RESULT: ${{ job.status }}
        run: |
          echo "Build ${BUILD_NUMBER:-not allocated}: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect https://appstoreconnect.apple.com/apps/6792223291/testflight" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "${{ runner.temp }}/portdeck-asc/AuthKey.p8"
